<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <filter id="glow-g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad-g)"/>
  <!-- Matrix / Grid -->
  <g stroke="rgba(0, 255, 136, 0.06)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>
  <!-- Header HUD -->
  <rect x="30" y="25" width="740" height="45" rx="8" fill="rgba(16, 25, 20, 0.6)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
  <circle cx="55" cy="47" r="5" fill="#00ff88" filter="url(#glow-g)"/>
  <text x="72" y="52" fill="#00ff88" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">GESTURE RECOGNITION // CNN TRANSFER LEARNING</text>
  <text x="630" y="51" fill="#94a3b8" font-family="monospace" font-size="12">STREAM: 30 FPS</text>

  <!-- Left: Hand Skeleton Landmarks -->
  <rect x="30" y="85" width="380" height="335" rx="10" fill="rgba(12, 17, 24, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="50" y="115" fill="#cbd5e1" font-family="monospace" font-size="12">21-LANDMARK SKELETON TRACKING</text>
  
  <!-- Skeletal Hand Bones (Peace sign) -->
  <!-- Wrist -->
  <circle cx="220" cy="350" r="6" fill="#00ff88" filter="url(#glow-g)"/>
  <!-- Palm -->
  <line x1="220" y1="350" x2="160" y2="310" stroke="#00ff88" stroke-width="2"/>
  <line x1="220" y1="350" x2="195" y2="280" stroke="#00ff88" stroke-width="2"/>
  <line x1="220" y1="350" x2="245" y2="275" stroke="#00ff88" stroke-width="2"/>
  <line x1="220" y1="350" x2="280" y2="315" stroke="#00ff88" stroke-width="2"/>
  <!-- Thumb -->
  <circle cx="160" cy="310" r="5" fill="#00ff88"/>
  <circle cx="130" cy="280" r="5" fill="#00ff88"/>
  <line x1="160" y1="310" x2="130" y2="280" stroke="#00ff88" stroke-width="2"/>
  <!-- Index finger (extended - peace) -->
  <circle cx="195" cy="280" r="5" fill="#00ff88"/>
  <circle cx="185" cy="220" r="5" fill="#00ff88"/>
  <circle cx="175" cy="170" r="6" fill="#b6ff00" filter="url(#glow-g)"/>
  <line x1="195" y1="280" x2="185" y2="220" stroke="#00ff88" stroke-width="2.5"/>
  <line x1="185" y1="220" x2="175" y2="170" stroke="#b6ff00" stroke-width="2.5"/>
  <!-- Middle finger (extended - peace) -->
  <circle cx="245" cy="275" r="5" fill="#00ff88"/>
  <circle cx="250" cy="210" r="5" fill="#00ff88"/>
  <circle cx="255" cy="155" r="6" fill="#b6ff00" filter="url(#glow-g)"/>
  <line x1="245" y1="275" x2="250" y2="210" stroke="#00ff88" stroke-width="2.5"/>
  <line x1="250" y1="210" x2="255" y2="155" stroke="#b6ff00" stroke-width="2.5"/>
  <!-- Ring finger (folded) -->
  <circle cx="280" cy="290" r="5" fill="#00ff88"/>
  <!-- Pinky (folded) -->
  <circle cx="295" cy="305" r="5" fill="#00ff88"/>
  
  <rect x="50" y="375" width="145" height="28" rx="4" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1"/>
  <text x="60" y="393" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold">GESTURE: "PEACE"</text>
  <text x=\"210\" y="393" fill="#cbd5e1" font-family="monospace" font-size="12">CONFIDENCE: 99.2%</text>

  <!-- Right: Architecture & Explainability -->
  <rect x="430" y="85" width="340" height="335" rx="10" fill="rgba(12, 17, 24, 0.8)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="450" y="115" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold">MODEL EXPLAINABILITY / CAM</text>
  
  <!-- Heatmap preview box -->
  <rect x="450" y="135" width="300" height="120" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(0, 255, 136, 0.2)" stroke-width="1"/>
  <!-- Heatmap gradient circles -->
  <circle cx="520" cy="195" r="35" fill="#00ff88" fill-opacity="0.35" filter="url(#glow-g)"/>
  <circle cx="590" cy="185" r="40" fill="#b6ff00" fill-opacity="0.45" filter="url(#glow-g)"/>
  <circle cx="590" cy="185" r="15" fill="#ffffff" fill-opacity="0.6"/>
  <text x="465" y="240" fill="#94a3b8" font-family="monospace" font-size="10">Grad-CAM Saliency: Finger Tips Focus</text>

  <!-- Model comparison -->
  <text x="450" y="285" fill="#cbd5e1" font-family="monospace" font-size="11">ARCHITECTURE BENCHMARK:</text>
  <text x="450" y="310" fill="#00ff88" font-family="monospace" font-size="11">&#8226; ResNet50 (Fine-Tuned): 98.6% Acc</text>
  <text x="450" y="330" fill="#94a3b8" font-family="monospace" font-size="11">&#8226; MobileNetV2: 96.4% Acc (22ms)</text>
  <text x="450" y="350" fill="#94a3b8" font-family="monospace" font-size="11">&#8226; Custom CNN: 93.1% Acc (12ms)</text>

  <!-- Bottom chips -->
  <rect x="450" y="375" width="120" height="24" rx="4" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
  <text x="460" y="391" fill="#00ff88" font-family="monospace" font-size="10">TKINTER GUI: ACTIVE</text>
  <rect x="585" y="375" width="120" height="24" rx="4" fill="rgba(0, 255, 136, 0.1)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
  <text x="595" y="391" fill="#00ff88" font-family="monospace" font-size="10">OPENCV VIDEO IN</text>
</svg>
